# FBM settings. `fbm setup` copies this file to config/settings.toml (gitignored, per install) and fills it in.
# Secrets never go here: they live in the OS credential store (Windows Credential Manager / macOS Keychain /
# Linux Secret Service) via `fbm auth` and `fbm notify setup`.

[owner]
# Your IANA time zone (e.g. "America/New_York", "Europe/London", "Asia/Manila"). Used for quiet hours and
# automation times. Yahoo NBA game days are always US/Eastern dates regardless of this.
timezone = "UTC"

[league]
# "demo" (simulated league over real players) until you connect Yahoo (`fbm yahoo login`, or the official API once
# approved), then "yahoo".
source = "demo"

[agent]
# The AI coding agent you use: copilot | claude-code | codex | cursor | gemini | generic
name = "generic"
# Model per role (names as your agent spells them). Leave empty to use the agent's default.
gm_model = ""        # decisions: a frontier model
reviewer_model = ""  # independent review: ideally a different model family than the GM
routine_model = ""   # cheap routine runs (lineup guard, health)

[automation]
# none | agent-app (e.g. Copilot app Automations) | scheduler (OS scheduler runs your agent headless)
# | engine-only (OS scheduler runs deterministic fbm jobs, no AI)
mode = "none"
# Any of: data-sync, lineup-guard, daily-gm, weekly-retro, trade-scan, health
jobs = []

[proposals]
# FBM never changes your league. It gives insights, daily lineup recommendations (exact steps you set in Yahoo)
# and proposals (add/drop, waiver claim, trade, strategy): GM drafts -> independent review -> you approve or reject
# -> FBM gives exact steps -> you make the move in Yahoo -> you confirm. Unapproved proposals expire.
expiry_hours = 18

[notify]
# Where alerts and digests go, in order (`fbm notify setup`; docs/telegram.md): "telegram" (your own Telegram bot,
# direct), "openclaw" (through your OpenClaw assistant; with "telegram" too it falls back to direct Telegram) and
# "email" (Gmail). Not set = ["email"] when email_enabled is true, else none.
# channels = ["telegram"]
# Your numeric Telegram chat id. The bot token lives in the OS credential store, never here.
telegram_chat_id = ""
# OpenClaw CLI (name on PATH or full path), used when "openclaw" is a channel.
openclaw_bin = "openclaw"
# Optional Gmail notifications (`fbm notify setup`). Reports also live in reports/ and your agent session.
email_enabled = false
# Empty = send to the Gmail sender address.
recipients = []
# Window in your time zone ([owner] timezone) when non-urgent messages (digests, reports) wait, on every
# channel, e.g. "23:00-07:00"; alerts and approval requests still arrive. Empty = none.
quiet_hours = ""

[hashtag]
# Hashtag Basketball Premium (hashtagbasketball.com, Patreon). When enabled, HT is FBM's only source of player
# projections and weekly matchup totals, and FBM gives no suggestions while HT is unhealthy (no fallback).
# Sign in with `fbm hashtag login` (your own browser sign-in; the session lives in the OS credential store).
# Personal use only: HT content stays local and is never republished.
enabled = false
# HT's league id for your imported Yahoo league (the Yahoo league id, e.g. "30273").
league_id = ""
